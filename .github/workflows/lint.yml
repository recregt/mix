name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt-and-clippy:
    name: Format & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/recregt/mix-nix-test@sha256:e9f551ac9ed040e69ca69f0a61a1207adf8ba1a8103e1d3b6d6b28f31eb8b43e # latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  machete:
    name: Unused Dependencies (machete)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-machete

      - run: cargo machete

  commit-messages:
    name: Commit Messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: recregt/commitlint
          ref: v1.0.0
          path: .commitlint
          persist-credentials: false

      - name: Lint commit messages
        run: |
          for sha in $(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            git log --format=%B -n1 "$sha" > /tmp/commit-msg
            python3 .commitlint/.lefthook/commit-msg/commit-msg.py /tmp/commit-msg "$sha"
          done
