name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Restore the mirror fixtures
        id: mirror
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mix-bootstrap-tests/cache
            ~/.cache/mix-bootstrap-tests/cache-*.built
            ~/.cache/mix-bootstrap-tests/nix-*.tar.xz
            ~/.cache/mix-bootstrap-tests/nixpkgs-*.tar.gz
            ~/.cache/mix-bootstrap-tests/home-manager-*.tar.gz
          key: e2e-mirror-${{ hashFiles('crates/pins/src/lib.rs', 'e2e/support/mirror.py') }}

      - name: Run integration tests
        env:
          MIX_TEST_IMAGE: ghcr.io/recregt/mix-bootstrap-test
          MIX_TEST_ALLOW_NETWORK: "1"
          PYTHONUNBUFFERED: "1"
        run: bash e2e/run.sh --durations=15

      - name: Save the mirror fixtures
        if: always() && steps.mirror.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mix-bootstrap-tests/cache
            ~/.cache/mix-bootstrap-tests/cache-*.built
            ~/.cache/mix-bootstrap-tests/nix-*.tar.xz
            ~/.cache/mix-bootstrap-tests/nixpkgs-*.tar.gz
            ~/.cache/mix-bootstrap-tests/home-manager-*.tar.gz
          key: e2e-mirror-${{ hashFiles('crates/pins/src/lib.rs', 'e2e/support/mirror.py') }}

      - name: Upload the events of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-events
          path: target/e2e-events/
          if-no-files-found: ignore
