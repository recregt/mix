name: Fuzz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nixgen:
    name: mix-nixgen ${{ matrix.target }} (${{ matrix.hours }}h)
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      ASAN_OPTIONS: malloc_context_size=0
      RUSTUP_TOOLCHAIN: nightly
    container:
      image: ghcr.io/recregt/mix-nix-fuzz@sha256:c81e71c1e17055e7394d8e96bb972d952a96d9dc1b7a92abc0c1ba2df9914191 # latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: parse
            hours: 1
            max-total-time: 3600
            cache-key: nixgen-parse-fuzz-corpus-
            verifier: verify-corpus
          - target: ident
            hours: 1
            max-total-time: 3600
            cache-key: nixgen-ident-fuzz-corpus-
            verifier: ""
          - target: attr-path
            hours: 1
            max-total-time: 3600
            cache-key: nixgen-attr-path-fuzz-corpus-
            verifier: ""
          - target: flake
            hours: 1
            max-total-time: 3600
            cache-key: nixgen-flake-fuzz-corpus-
            verifier: ""
          - target: home
            hours: 1
            max-total-time: 3600
            cache-key: nixgen-home-fuzz-corpus-
            verifier: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: crates/nixgen/fuzz
          key: ${{ matrix.target }}

      - name: Restore the fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/nixgen/fuzz/corpus/${{ matrix.target }}
          key: ${{ matrix.cache-key }}${{ github.run_id }}
          restore-keys: |
            ${{ matrix.cache-key }}

      - name: Fuzz mix-nixgen's ${{ matrix.target }} for ${{ matrix.hours }} hour(s)
        working-directory: crates/nixgen
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ matrix.max-total-time }} -timeout=10

      - name: Minimize the corpus
        if: always()
        working-directory: crates/nixgen
        run: cargo fuzz cmin ${{ matrix.target }}

      - name: Save the fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/nixgen/fuzz/corpus/${{ matrix.target }}
          key: ${{ matrix.cache-key }}${{ github.run_id }}

      - name: Build the corpus verifier
        if: always() && matrix.verifier != ''
        working-directory: crates/nixgen/fuzz
        run: cargo build --release --bin ${{ matrix.verifier }}

      - name: Verify the grown corpus parses and evaluates through real Nix
        if: always() && matrix.verifier != ''
        working-directory: crates/nixgen/fuzz
        run: ./target/release/${{ matrix.verifier }} corpus/${{ matrix.target }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixgen-fuzz-crash-artifacts-${{ matrix.target }}
          path: crates/nixgen/fuzz/artifacts/${{ matrix.target }}/

  events:
    name: mix-render event_stream (1h)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      ASAN_OPTIONS: malloc_context_size=0
      RUSTUP_TOOLCHAIN: nightly
    container:
      image: ghcr.io/recregt/mix-nix-fuzz@sha256:c81e71c1e17055e7394d8e96bb972d952a96d9dc1b7a92abc0c1ba2df9914191 # latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: crates/render/fuzz
          key: event_stream

      - name: Restore the fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/render/fuzz/corpus/event_stream
          key: render-event-stream-fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            render-event-stream-fuzz-corpus-
            cli-event-stream-fuzz-corpus-

      - name: Fuzz mix-render's event_stream for 1 hour
        working-directory: crates/render
        run: cargo fuzz run event_stream -- -max_total_time=3600 -timeout=10 -close_fd_mask=3

      - name: Minimize the corpus
        if: always()
        working-directory: crates/render
        run: cargo fuzz cmin event_stream

      - name: Save the fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/render/fuzz/corpus/event_stream
          key: render-event-stream-fuzz-corpus-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-fuzz-crash-artifacts-event_stream
          path: crates/render/fuzz/artifacts/event_stream/
