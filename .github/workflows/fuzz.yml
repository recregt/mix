name: Fuzz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nixgen:
    name: mix-nixgen ${{ matrix.target }} (${{ matrix.hours }}h)
    runs-on: ubuntu-latest
    timeout-minutes: 200
    container:
      image: ghcr.io/recregt/mix-nix-fuzz@sha256:c81e71c1e17055e7394d8e96bb972d952a96d9dc1b7a92abc0c1ba2df9914191 # latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: codegen
            hours: 3
            max-total-time: 10800
            cache-key: nixgen-fuzz-corpus-
            verifier: verify_corpus
          - target: flake
            hours: 1
            max-total-time: 3600
            cache-key: nixgen-flake-fuzz-corpus-
            verifier: verify_flake_corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/nixgen/fuzz
          key: ${{ matrix.target }}

      - name: Restore the fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/nixgen/fuzz/corpus/${{ matrix.target }}
          key: ${{ matrix.cache-key }}${{ github.run_id }}
          restore-keys: |
            ${{ matrix.cache-key }}

      - name: Fuzz mix-nixgen's ${{ matrix.target }} for ${{ matrix.hours }} hour(s)
        working-directory: crates/nixgen
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ matrix.max-total-time }} -timeout=10

      - name: Build the corpus verifier
        if: always()
        working-directory: crates/nixgen/fuzz
        run: cargo build --release --bin ${{ matrix.verifier }}

      - name: Verify the grown corpus parses and round-trips through real Nix
        if: always()
        working-directory: crates/nixgen/fuzz
        run: ./target/release/${{ matrix.verifier }} corpus/${{ matrix.target }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixgen-fuzz-crash-artifacts-${{ matrix.target }}
          path: crates/nixgen/fuzz/artifacts/${{ matrix.target }}/
