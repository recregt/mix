name: Fuzz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nixgen:
    name: mix-nixgen ${{ matrix.target }} (${{ matrix.hours }}h)
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      ASAN_OPTIONS: malloc_context_size=0
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: parse
            hours: 1
            max-total-time: 3600
            cache-key: nixgen-parse-fuzz-corpus-
            verifier: verify-corpus
          - target: ident
            hours: 1
            max-total-time: 3600
            cache-key: nixgen-ident-fuzz-corpus-
            verifier: ""
          - target: attr-path
            hours: 1
            max-total-time: 3600
            cache-key: nixgen-attr-path-fuzz-corpus-
            verifier: ""
          - target: flake
            hours: 1
            max-total-time: 3600
            cache-key: nixgen-flake-fuzz-corpus-
            verifier: ""
          - target: home
            hours: 1
            max-total-time: 3600
            cache-key: nixgen-home-fuzz-corpus-
            verifier: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Restore the fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/nixgen/fuzz/corpus/${{ matrix.target }}
          key: ${{ matrix.cache-key }}${{ github.run_id }}
          restore-keys: |
            ${{ matrix.cache-key }}

      - name: Fuzz mix-nixgen's ${{ matrix.target }} for ${{ matrix.hours }} hour(s)
        working-directory: crates/nixgen
        run: nix develop ../..#fuzz --command cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ matrix.max-total-time }} -timeout=10

      - name: Minimize the corpus
        if: always()
        working-directory: crates/nixgen
        run: nix develop ../..#fuzz --command cargo fuzz cmin ${{ matrix.target }}

      - name: Save the fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/nixgen/fuzz/corpus/${{ matrix.target }}
          key: ${{ matrix.cache-key }}${{ github.run_id }}

      - name: Build the corpus verifier
        if: always() && matrix.verifier != ''
        working-directory: crates/nixgen/fuzz
        run: nix develop ../../..#fuzz --command cargo build --release --bin ${{ matrix.verifier }}

      - name: Verify the grown corpus parses and evaluates through real Nix
        if: always() && matrix.verifier != ''
        working-directory: crates/nixgen/fuzz
        run: ./target/release/${{ matrix.verifier }} corpus/${{ matrix.target }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nixgen-fuzz-crash-artifacts-${{ matrix.target }}
          path: crates/nixgen/fuzz/artifacts/${{ matrix.target }}/

  events:
    name: mix-render event_stream (1h)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      ASAN_OPTIONS: malloc_context_size=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Restore the fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/render/fuzz/corpus/event_stream
          key: render-event-stream-fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            render-event-stream-fuzz-corpus-

      - name: Fuzz mix-render's event_stream for 1 hour
        working-directory: crates/render
        run: nix develop ../..#fuzz --command cargo fuzz run event_stream -- -max_total_time=3600 -timeout=10 -close_fd_mask=3

      - name: Minimize the corpus
        if: always()
        working-directory: crates/render
        run: nix develop ../..#fuzz --command cargo fuzz cmin event_stream

      - name: Save the fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/render/fuzz/corpus/event_stream
          key: render-event-stream-fuzz-corpus-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-fuzz-crash-artifacts-event_stream
          path: crates/render/fuzz/artifacts/event_stream/
