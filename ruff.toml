line-length = 100
target-version = "py314"
extend-exclude = ["target"]

[lint]
select = ["E", "W", "F", "I", "B", "UP", "PT", "SIM", "RUF", "PL", "PERF"]

ignore = ["PLR0911"]

[lint.per-file-ignores]
"e2e/test_*.py" = ["PLR2004"]
"e2e/conftest.py" = ["E402"]

[lint.isort]
known-first-party = ["support"]
