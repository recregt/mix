[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ömer Tekin"]
license = "MPL-2.0"

[workspace.lints.clippy]
self_named_module_files = "deny"

[workspace.dependencies]
divan = { version = "=5.0.2", package = "codspeed-divan-compat" }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
mimalloc = "0.1.52"
mix-core = { path = "crates/core" }
mix-events = { path = "crates/events" }
mix-exec = { path = "crates/exec" }
mix-nixgen = { path = "crates/nixgen" }
mix-nixlog = { path = "crates/nixlog" }
mix-pins = { path = "crates/pins" }
mix-render = { path = "crates/render" }
mix-rpc = { path = "crates/rpc" }
mix-shell = { path = "crates/shell" }
mix-testchild = { path = "crates/testchild" }
mix-ui = { path = "crates/ui" }
nix = { version = "0.31.3", features = ["user", "fs"] }
proptest = "1.11.0"
prost = "0.14.4"
protox = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
uuid = { version = "1.26.1", features = ["v7"] }

[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
strip = "symbols"
