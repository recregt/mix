[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/pins",
    "crates/nixgen",
    "crates/app",
    "crates/ui",
    "crates/cli",
    "crates/bin",
]

[workspace.dependencies]
async-trait = "0.1.92"
divan = { version = "=5.0.1", package = "codspeed-divan-compat" }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
nix = { version = "0.31.3", features = ["user", "fs"] }
proptest = "1.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
tracing = "0.1.44"
