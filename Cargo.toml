[workspace]
resolver = "2"
members = [
    "crates/exec",
    "crates/events",
    "crates/core",
    "crates/pins",
    "crates/nixgen",
    "crates/shell",
    "crates/ui",
    "crates/cli",
    "crates/rpc",
    "crates/daemon",
    "crates/explain",
    "crates/render",
    "crates/testchild",
    "crates/conformance",
    "crates/nixlog",
]

[workspace.package]
version = "0.1.0"

[workspace.lints.clippy]
self_named_module_files = "deny"

[workspace.dependencies]
divan = { version = "=5.0.2", package = "codspeed-divan-compat" }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
nix = { version = "0.31.3", features = ["user", "fs"] }
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
