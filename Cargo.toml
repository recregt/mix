[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/ui",
    "crates/cli",
    "crates/bin",
]

[workspace.dependencies]
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1.44"
