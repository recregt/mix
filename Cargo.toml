[workspace]
resolver = "2"
members = [
    "crates/bootstrap",
    "crates/core",
    "crates/app",
]

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
lzma-rs = "0.3.0"
memchr = "2.8.3"
nix = { version = "0.31.3", features = ["user", "fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
which = "8.0.6"
