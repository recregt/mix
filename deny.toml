[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
