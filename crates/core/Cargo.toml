[package]
name = "mix-core"
version.workspace = true
edition = "2024"
authors = ["Ömer Tekin"]
license = "MPL-2.0"

[dependencies]
similar = "3.2.0"
mix-events = { path = "../events" }
mix-nixgen = { path = "../nixgen" }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
generativity = "1.2.1"

[dev-dependencies]
proptest = { workspace = true }
divan = { workspace = true }
trybuild = "=1.0.121"

[[bench]]
name = "nix_log"
harness = false

[[bench]]
name = "runner"
harness = false

[[bench]]
name = "state"
harness = false

[[bench]]
name = "targets"
harness = false

[lints]
workspace = true
