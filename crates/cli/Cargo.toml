[package]
name = "mix-cli"
version = "0.1.0"
edition = "2024"
authors = ["Ömer Tekin"]
license = "MPL-2.0"

[features]
embed-tarball = ["mix-shell/embed-tarball"]

[dependencies]
mix-shell = { path = "../shell" }
mix-core = { path = "../core" }
mix-exec = { path = "../exec" }
mix-rpc = { path = "../rpc" }
mix-ui = { path = "../ui" }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = { workspace = true }
nix = { workspace = true, features = ["signal"] }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = "0.3.23"
mix-events = { path = "../events" }
prost = "0.14.4"

[dev-dependencies]
mix-nixgen = { path = "../nixgen" }
divan = { workspace = true }

[[bench]]
name = "explain"
harness = false
