[package]
name = "mix-cli"
version.workspace = true
edition = "2024"
authors = ["Ömer Tekin"]
license = "MPL-2.0"

[dependencies]
thiserror = { workspace = true }
mix-core = { path = "../core" }
mix-exec = { path = "../exec" }
mix-rpc = { path = "../rpc" }
mix-ui = { path = "../ui" }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = { workspace = true }
nix = { workspace = true, features = ["signal"] }
tokio = { workspace = true, features = ["signal"] }
mix-events = { path = "../events" }
pbjson-types = "0.9.0"
serde_json = { workspace = true }

[dev-dependencies]
mix-shell = { path = "../shell" }
mix-nixgen = { path = "../nixgen" }
divan = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "explain"
harness = false
