[package]
name = "mix-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "mix-daemon"
path = "src/main.rs"

[features]
embed-tarball = ["mix-shell/embed-tarball"]

[dependencies]
mimalloc = { workspace = true }
mix-core = { workspace = true }
mix-events = { workspace = true }
mix-exec = { workspace = true }
mix-rpc = { workspace = true }
mix-shell = { workspace = true }
mix-ui = { workspace = true }
nix = { workspace = true, features = ["signal"] }
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
futures-util = { workspace = true }
mix-core = { workspace = true, features = ["testkit"] }
tempfile = { workspace = true }

[lints]
workspace = true
