[package]
name = "mix-bootstrap"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []
embed-tarball = []

[dependencies]
mix-core = { path = "../core" }
async-trait = { workspace = true }
lzma-rs = "0.3.0"
nix = { version = "0.31.3", features = ["user", "fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
sha2 = "0.11.0"
