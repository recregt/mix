syntax = "proto3";

package mix.worker.v1;

service WorkerService {
  rpc Hello(HelloRequest) returns (HelloResponse);
  rpc Run(stream RunRequest) returns (stream RunResponse);
}

message HelloRequest {
  string version = 1;
  uint32 protocol = 2;
}

message HelloResponse {
  string version = 1;
  uint32 protocol = 2;
}

enum Control {
  CONTROL_UNSPECIFIED = 0;
  CONTROL_INTERRUPT = 1;
  CONTROL_TERMINATE = 2;
  CONTROL_PAUSE = 3;
  CONTROL_RESUME = 4;
}

message RunRequest {
  oneof call {
    bytes command = 1;
    Control control = 2;
  }
}

message RunResponse {
  oneof reply {
    bytes envelope = 1;
    Control applied = 2;
  }
}
