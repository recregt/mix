syntax = "proto3";

package mix.worker.v1;

service WorkerService {
  rpc Bootstrap(BootstrapRequest) returns (stream BootstrapResponse);
  rpc Repair(RepairRequest) returns (stream RepairResponse);
}

message Mirror {
  string url = 1;
  optional string key = 2;
}

message BootstrapRequest {
  optional Mirror mirror = 1;
  bool force = 2;
  Level log_level = 3;
}

message RepairRequest {
  Level log_level = 1;
}

message BootstrapResponse {
  Event event = 1;
}

message RepairResponse {
  Event event = 1;
}

message Event {
  oneof kind {
    Finished finished = 9;
    bytes envelope = 10;
  }
}

enum Level {
  LEVEL_UNSPECIFIED = 0;
  LEVEL_ERROR = 1;
  LEVEL_WARN = 2;
  LEVEL_INFO = 3;
  LEVEL_DEBUG = 4;
  LEVEL_TRACE = 5;
}

message Finished {
  oneof outcome {
    BootstrapDone bootstrap_done = 1;
    RepairDone repair_done = 2;
    Failure failure = 3;
  }
}

message BootstrapDone {}

message RepairDone {
  repeated RepairReport reports = 1;
  bool interrupted = 2;
}

message RepairReport {
  string name = 1;
  optional TargetFailure failure = 2;
}

message Failure {
  oneof kind {
    CoreFailure core = 1;
    Detail network = 3;
    Integrity integrity = 4;
    Detail unsupported_target = 5;
    TargetFailure target = 6;
    Detail decompression = 7;
    Detail malformed_archive = 8;
    Detail not_root = 9;
    Empty unsupported_host = 10;
    Empty unsupported_kernel = 11;
    SystemdNotReady systemd_not_ready = 12;
    Empty already_managed = 13;
    Path cross_device_store = 14;
    Rollback rollback = 15;
    Empty interrupted = 16;
    Detail invalid_mirror = 17;
    Conflict conflict = 18;
    Empty systemd_unreachable = 19;
    Unit unit = 20;
  }
}

message Unit {
  string operation = 1;
  string unit = 2;
  string detail = 3;
  optional string invocation = 4;
}

message Conflict {
  string subject = 1;
  string expected = 2;
  string found = 3;
}

message Empty {}

message Detail {
  string detail = 1;
}

message Path {
  string path = 1;
}

message Integrity {
  string artifact = 1;
  string detail = 2;
}

enum Host {
  HOST_UNSPECIFIED = 0;
  HOST_NATIVE = 1;
  HOST_WSL = 2;
}

message SystemdNotReady {
  Host host = 1;
}

message Rollback {
  Failure cause = 1;
  string summary = 2;
}

message TargetFailure {
  oneof kind {
    CoreFailure core = 1;
    Unrepairable unrepairable = 2;
  }
}

enum Unfixable {
  UNFIXABLE_UNSPECIFIED = 0;
  UNFIXABLE_NOT_A_DIRECTORY = 1;
  UNFIXABLE_MISSING_USER = 2;
  UNFIXABLE_MISSING_RUNTIME = 3;
}

message Unrepairable {
  string artifact = 1;
  Unfixable reason = 2;
}

message CoreFailure {
  oneof kind {
    Io io = 1;
    Command command = 2;
    Exec exec = 3;
    Detail task_panicked = 4;
    Detail cancelled = 5;
    Path locked = 6;
    Path lock_missing = 7;
  }
}

message Io {
  string path = 1;
  string kind = 2;
  string message = 3;
}

message Command {
  string command = 1;
  string detail = 2;
}

message Exec {
  string command = 1;
  string kind = 2;
  string message = 3;
}
