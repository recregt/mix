[package]
name = "mix-app"
version = "0.1.0"
edition = "2024"
build = "build.rs"
authors = ["Ömer Tekin"]
license = "MPL-2.0"

[features]
default = []
embed-tarball = []

[dependencies]
mix-core = { path = "../core" }
mix-nixgen = { path = "../nixgen" }
async-trait = { workspace = true }
liblzma = { version = "0.4.8", default-features = false, features = ["static"] }
nix = { workspace = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }

[build-dependencies]
sha2 = "0.11.0"

[dev-dependencies]
divan = { workspace = true }
mockito = "=1.7.2"

[[bench]]
name = "tarball"
harness = false
