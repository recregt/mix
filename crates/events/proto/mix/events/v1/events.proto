syntax = "proto3";

package mix.events.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message Envelope {
  uint64 seq = 1;
  string request = 2;
  oneof event {
    NodeStarted node_started = 10;
    NodeProgress node_progress = 11;
    NodeFinished node_finished = 12;
    NotRun not_run = 13;
    Diagnostic diagnostic = 14;
  }
}

message NodeStarted {
  fixed64 id = 1;
  fixed64 parent = 2;
  string key = 3;
  repeated string planned = 4;
  bool shielded = 5;
  oneof kind {
    Command command = 10;
    Plan plan = 11;
    Step step = 12;
    Rollback rollback = 13;
    Process process = 14;
    Download download = 15;
    Inspection inspection = 16;
    LockWait lock_wait = 17;
    NixActivity nix_activity = 18;
    Action action = 19;
  }
}

message Command {
  string mix_version = 1;
  uint32 schema_minor = 2;
  bool dry_run = 3;
  oneof request {
    BootstrapRequest bootstrap = 10;
    InstallRequest install = 11;
    RemoveRequest remove = 12;
    RepairRequest repair = 13;
    DoctorRequest doctor = 14;
    CleanRequest clean = 15;
    ExplainRequest explain = 16;
  }
}

message ExplainRequest {
  optional Code code = 1;
}

message BootstrapRequest {
  bool force = 1;
  optional string mirror = 2;
  optional string mirror_key = 3;
}

message InstallRequest {
  repeated string packages = 1;
}

message RemoveRequest {
  repeated string packages = 1;
}

message RepairRequest {}

message DoctorRequest {}

message CleanRequest {
  bool all = 1;
}

message Plan {
  string title = 1;
}

message Step {
  Verb verb = 1;
  string subject = 2;
}

enum Verb {
  VERB_UNSPECIFIED = 0;
  VERB_CREATING = 1;
  VERB_REMOVING = 2;
  VERB_INSTALLING = 3;
  VERB_WRITING = 4;
  VERB_CONFIGURING = 5;
  VERB_ACTIVATING = 6;
  VERB_RECORDING = 7;
  VERB_RESTARTING = 8;
  VERB_REPAIRING = 9;
  VERB_RECOVERING = 10;
}

message Rollback {
  fixed64 undoes = 1;
}

message Process {
  string program = 1;
  repeated string args = 2;
}

message Download {
  string artifact = 1;
  string url = 2;
}

enum Category {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_FILESYSTEM = 1;
  CATEGORY_IDENTITY = 2;
  CATEGORY_SERVICES = 3;
  CATEGORY_CONFIGURATION = 4;
}

message Inspection {
  string target = 1;
  Category category = 2;
}

message LockWait {
  string lock = 1;
  optional string holder = 2;
  optional string command = 3;
}

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_CREATE_DIR = 1;
  OPERATION_PUT_FILE = 2;
  OPERATION_SET_MODE = 3;
  OPERATION_SET_OWNER = 4;
  OPERATION_SET_ASIDE = 5;
  OPERATION_REMOVE_CREATED = 6;
  OPERATION_REMOVE_CREATED_TREE = 7;
  OPERATION_RESTORE = 8;
  OPERATION_RECLAIM_TREE = 9;
  OPERATION_COPY_TREE = 10;
  OPERATION_ADD_GROUP = 11;
  OPERATION_SET_GROUP_GID = 12;
  OPERATION_DELETE_GROUP = 13;
  OPERATION_ADD_USER = 14;
  OPERATION_SET_USER_IDS = 15;
  OPERATION_DELETE_USER = 16;
  OPERATION_ADD_MEMBER = 17;
  OPERATION_REMOVE_MEMBER = 18;
  OPERATION_INSTALL_UNIT = 19;
  OPERATION_ENABLE_UNIT = 20;
  OPERATION_DISABLE_UNIT = 21;
  OPERATION_START_UNIT = 22;
  OPERATION_STOP_UNIT = 23;
  OPERATION_RESTART_UNIT = 24;
  OPERATION_DAEMON_RELOAD = 25;
  OPERATION_INSTALL_RUNTIME = 26;
  OPERATION_REMOVE_RUNTIME = 27;
  OPERATION_ACTIVATE_PROFILE = 28;
  OPERATION_SWITCH_GENERATION = 29;
  OPERATION_DELETE_GENERATION = 30;
  OPERATION_RECORD_STATE = 31;
  OPERATION_COMMIT = 32;
  OPERATION_APPLY_GENERATION = 33;
  OPERATION_CREATE_DIRS = 34;
  OPERATION_COLLECT_GARBAGE = 35;
  OPERATION_DRAIN_SERVICE = 36;
  OPERATION_CREATE_REPOSITORY = 37;
}

message Action {
  Operation operation = 1;
  string subject = 2;
}

message NixActivity {
  string activity_type = 1;
  string text = 2;
}

message NodeProgress {
  fixed64 id = 1;
  oneof progress {
    Bytes bytes = 2;
    Builds builds = 3;
    OutputLine line = 4;
    CommandStarted command = 5;
    FetchStarted fetch = 6;
    BuildStarted build = 7;
    Stopping stopping = 8;
    CommandFinished command_finished = 9;
    Observed observed = 10;
    Journaled journaled = 11;
    SubstitutionStarted substitution = 12;
    LockWait waiting = 13;
  }
}

message CommandFinished {
  string line = 1;
  optional int32 exit_code = 2;
  optional int32 signal = 3;
}

message Observed {
  repeated Observation observations = 1;
}

message Observation {
  oneof query {
    string path = 1;
    string contents = 2;
    string group = 3;
    string user = 4;
    string unit = 5;
    string profile = 6;
    string tree_owner = 7;
    string repository = 8;
    string journals = 22;
    string leftovers = 23;
    string strangers = 24;
    string clobbered = 25;
    string program = 26;
  }
  oneof fact {
    PathFact path_fact = 10;
    ContentsFact contents_fact = 11;
    GroupFact group_fact = 12;
    UserFact user_fact = 13;
    UnitFact unit_fact = 14;
    ProfileFact profile_fact = 15;
    TreeOwnerFact tree_owner_fact = 16;
    RepositoryFact repository_fact = 17;
    PathsFact journals_fact = 18;
    PathsFact leftovers_fact = 19;
    StrangerFact stranger_fact = 20;
    PathsFact clobbered_fact = 21;
    ProgramFact program_fact = 30;
  }
}

enum PathKind {
  PATH_KIND_UNSPECIFIED = 0;
  PATH_KIND_MISSING = 1;
  PATH_KIND_UNREADABLE = 2;
  PATH_KIND_DIRECTORY = 3;
  PATH_KIND_FILE = 4;
  PATH_KIND_SYMLINK = 5;
  PATH_KIND_OTHER = 6;
}

message PathFact {
  PathKind kind = 1;
  string unreadable = 2;
  uint32 mode = 3;
  uint32 uid = 4;
  uint32 gid = 5;
  optional FileIdentity id = 6;
  bytes digest = 7;
  optional google.protobuf.Timestamp changed = 8;
}

message FileIdentity {
  uint64 dev = 1;
  uint64 ino = 2;
  optional google.protobuf.Timestamp born = 3;
}

message ContentsFact {
  bool present = 1;
  uint64 length = 2;
}

message GroupFact {
  bool exists = 1;
  uint32 gid = 2;
  repeated string members = 3;
}

message UserFact {
  bool exists = 1;
  uint32 uid = 2;
  uint32 gid = 3;
  string home = 4;
  string shell = 5;
  string comment = 6;
}

message UnitFact {
  string load_state = 1;
  string active_state = 2;
  string file_state = 3;
  bool needs_reload = 4;
  optional google.protobuf.Timestamp active_since = 5;
}

message ProfileFact {
  repeated uint64 generations = 1;
  optional uint64 active = 2;
  repeated uint64 dangling = 3;
}

message TreeOwnerFact {
  optional uint32 uid = 1;
}

message RepositoryFact {
  bool intact = 1;
  bool recorded = 2;
}

message ProgramFact {
  bool same = 1;
}

message PathsFact {
  repeated string paths = 1;
}

message StrangerFact {
  optional string path = 1;
  uint32 uid = 2;
  uint32 gid = 3;
}

message Journaled {
  oneof record {
    Began began = 1;
    Sequenced prepared = 2;
    Sequenced done = 3;
    Sequenced settled = 4;
    Sequenced failed = 5;
    Action reverted = 6;
    google.protobuf.Empty committing = 7;
    google.protobuf.Empty ended = 8;
  }
}

message Began {
  string request = 1;
}

message Sequenced {
  uint64 seq = 1;
  repeated Action undo = 2;
}

message Stopping {
  Cancellation cause = 1;
}

message BuildStarted {
  string derivation = 1;
  string name = 2;
}

message CommandStarted {
  string line = 1;
}

message FetchStarted {
  string url = 1;
}

message SubstitutionStarted {
  string path = 1;
  string name = 2;
}

message Bytes {
  uint64 done = 1;
  optional uint64 total = 2;
}

message Builds {
  uint64 builds_done = 1;
  uint64 builds_expected = 2;
  uint64 builds_running = 3;
  uint64 downloads_done = 4;
  uint64 downloads_expected = 5;
  uint64 downloads_running = 6;
  uint64 bytes_done = 7;
  uint64 bytes_expected = 8;
}

enum Stream {
  STREAM_UNSPECIFIED = 0;
  STREAM_STDOUT = 1;
  STREAM_STDERR = 2;
}

message OutputLine {
  string text = 1;
  Stream stream = 2;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_SUCCEEDED = 1;
  STATUS_ALREADY_SATISFIED = 2;
  STATUS_FAILED = 3;
  STATUS_CANCELLED = 4;
}

enum Cancellation {
  CANCELLATION_UNSPECIFIED = 0;
  CANCELLATION_INTERRUPTED = 1;
  CANCELLATION_TERMINATED = 2;
  CANCELLATION_CLIENT_GONE = 3;
}

message NodeFinished {
  fixed64 id = 1;
  Status status = 2;
  Diagnostic diagnostic = 3;
  uint32 exit_code = 4;
  Cancellation cancellation = 5;
  oneof result {
    BootstrapResult bootstrap = 10;
    InstallResult install = 11;
    RemoveResult remove = 12;
    RepairResult repair = 13;
    DoctorResult doctor = 14;
    InspectionResult inspection = 15;
    ProcessResult process = 16;
    CleanResult clean = 17;
    ExplainResult explain = 18;
  }
}

message ExplainResult {
  repeated Code codes = 1;
}

message ProcessResult {
  optional int32 exit_code = 1;
  optional int32 signal = 2;
}

message BootstrapResult {
  string profile_snippet = 1;
}

message InstallResult {
  repeated string added = 1;
  repeated string skipped = 2;
  bool restored = 3;
}

message RemoveResult {
  repeated string removed = 1;
  repeated string skipped = 2;
  bool restored = 3;
}

message CleanResult {
  repeated uint64 generations = 1;
  optional uint64 freed_bytes = 2;
}

message RepairResult {
  repeated RepairReport reports = 1;
}

message RepairReport {
  string target = 1;
  bool fixed = 2;
  Diagnostic failure = 3;
}

message DoctorResult {
  repeated InspectionReport reports = 1;
}

message InspectionReport {
  string target = 1;
  Category category = 2;
  Finding finding = 3;
  Drift drift = 4;
  Unfixable unfixable = 5;
}

message InspectionResult {
  Finding finding = 1;
  Drift drift = 2;
}

message Drift {
  string path = 1;
  repeated Hunk hunks = 2;
}

message Hunk {
  uint32 found_line = 1;
  repeated string found = 2;
  repeated string expected = 3;
}

message Finding {
  oneof kind {
    google.protobuf.Empty missing = 1;
    Unreadable unreadable = 2;
    google.protobuf.Empty not_a_directory = 3;
    Mode mode = 4;
    Ids owner = 5;
    google.protobuf.Empty content_drift = 6;
    google.protobuf.Empty group_missing = 7;
    Gid group_gid = 8;
    NotAMember not_a_member = 9;
    google.protobuf.Empty no_such_user = 10;
    google.protobuf.Empty user_missing = 11;
    Ids user_ids = 12;
    google.protobuf.Empty unit_missing = 13;
    google.protobuf.Empty unit_drift = 14;
    google.protobuf.Empty unit_inactive = 15;
    google.protobuf.Empty runtime_missing = 16;
    google.protobuf.Empty repository_broken = 17;
    google.protobuf.Empty repository_locked = 18;
    Interrupted interrupted = 19;
    Paths leftovers = 20;
    Generation generation_dangling = 21;
    Paths in_the_way = 22;
  }
}

message Interrupted {
  repeated string requests = 1;
  repeated string pending = 2;
}

message Paths {
  repeated string paths = 1;
}

message Generation {
  uint64 generation = 1;
}

message Unreadable {
  string kind = 1;
}

message Mode {
  uint32 actual = 1;
  uint32 expected = 2;
}

message Ids {
  uint32 actual_uid = 1;
  uint32 actual_gid = 2;
  uint32 expected_uid = 3;
  uint32 expected_gid = 4;
}

message Gid {
  uint32 actual = 1;
  uint32 expected = 2;
}

message NotAMember {
  string group = 1;
}

enum NotRunReason {
  NOT_RUN_REASON_UNSPECIFIED = 0;
  NOT_RUN_REASON_NOT_REACHED = 1;
  NOT_RUN_REASON_SKIPPED = 2;
}

message NotRun {
  fixed64 parent = 1;
  string key = 2;
  NotRunReason reason = 3;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_ERROR = 1;
  SEVERITY_WARNING = 2;
}

enum Code {
  CODE_UNSPECIFIED = 0;
  CODE_INTERNAL = 1;
  CODE_IO = 2;
  CODE_PERMISSION_DENIED = 3;
  CODE_COMMAND_FAILED = 4;
  CODE_SPAWN_FAILED = 5;
  reserved 6;
  reserved "CODE_LOCKED";
  CODE_LOCK_MISSING = 7;
  CODE_CONFLICT = 8;
  CODE_UNIT_FAILED = 9;
  CODE_SYSTEMD_UNREACHABLE = 10;
  CODE_JOURNAL_UNWRITABLE = 11;
  CODE_CLEANUP_INCOMPLETE = 12;
  CODE_NETWORK = 20;
  CODE_INTEGRITY = 21;
  CODE_UNSUPPORTED_TARGET = 22;
  CODE_DECOMPRESSION = 23;
  CODE_MALFORMED_ARCHIVE = 24;
  CODE_NOT_ROOT = 25;
  CODE_UNSUPPORTED_HOST = 26;
  CODE_UNSUPPORTED_KERNEL = 27;
  CODE_SYSTEMD_NOT_READY = 28;
  CODE_ALREADY_MANAGED = 29;
  CODE_CROSS_DEVICE_STORE = 30;
  CODE_ROLLBACK_INCOMPLETE = 31;
  CODE_INVALID_MIRROR = 32;
  CODE_NOT_BOOTSTRAPPED = 41;
  CODE_ROOT_NOT_ALLOWED = 42;
  CODE_INVALID_PACKAGE = 43;
  CODE_INVALID_STATE = 44;
  CODE_NEWER_STATE = 45;
  CODE_PROTECTED_PACKAGE = 46;
  CODE_GIT_RECORD_FAILED = 47;
  CODE_UNKNOWN_PACKAGE = 48;
  CODE_BUILD_FAILED = 49;
  CODE_UNREPAIRABLE = 60;
  CODE_PRIVILEGES_UNAVAILABLE = 70;
  CODE_WORKER_ENDED = 71;
  CODE_VERSION_MISMATCH = 72;
  CODE_USAGE = 73;
  CODE_DAEMON_OUTDATED = 74;
}

enum Host {
  HOST_UNSPECIFIED = 0;
  HOST_NATIVE = 1;
  HOST_WSL = 2;
  HOST_NIXOS = 3;
}

enum Unfixable {
  UNFIXABLE_UNSPECIFIED = 0;
  UNFIXABLE_NOT_A_DIRECTORY = 1;
  UNFIXABLE_MISSING_USER = 2;
  UNFIXABLE_MISSING_RUNTIME = 3;
  UNFIXABLE_UNRECOVERED = 4;
  UNFIXABLE_IN_THE_WAY = 5;
}

message Diagnostic {
  Code code = 1;
  Severity severity = 2;
  fixed64 node = 3;
  string message = 4;
  repeated Diagnostic causes = 5;
  oneof detail {
    IoDetail io = 10;
    CommandDetail command = 11;
    NetworkDetail network = 12;
    IntegrityDetail integrity = 13;
    TargetDetail target = 14;
    HostDetail host = 15;
    PathDetail path = 16;
    PackagesDetail packages = 17;
    FormatDetail format = 18;
    UnrepairableDetail unrepairable = 19;
    LockDetail lock = 20;
    StepsDetail steps = 21;
    ConflictDetail conflict = 22;
    UnitDetail unit = 23;
  }
}

message IoDetail {
  string path = 1;
  string kind = 2;
}

message CommandDetail {
  string command = 1;
  optional int32 exit_status = 2;
  string output_tail = 3;
}

message NetworkDetail {
  string url = 1;
}

message IntegrityDetail {
  string artifact = 1;
  string expected = 2;
  string actual = 3;
}

message TargetDetail {
  string arch = 1;
  string os = 2;
}

message HostDetail {
  Host host = 1;
  string state = 2;
}

message PathDetail {
  string path = 1;
}

message PackagesDetail {
  repeated string packages = 1;
}

message FormatDetail {
  uint32 format = 1;
}

message UnrepairableDetail {
  string artifact = 1;
  Unfixable reason = 2;
}

message LockDetail {
  string path = 1;
  optional string holder = 2;
}

message StepsDetail {
  repeated string steps = 1;
}

message ConflictDetail {
  string subject = 1;
  string expected = 2;
  string found = 3;
}

message UnitDetail {
  string operation = 1;
  string unit = 2;
  optional string invocation = 3;
}
