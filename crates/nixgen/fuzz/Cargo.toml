[package]
name = "mix-nixgen-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
serde_json = "1"
tempfile = "3"

[dependencies.mix-nixgen]
path = ".."
features = ["parse"]

[[bin]]
name = "printer"
path = "fuzz_targets/printer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "installable"
path = "fuzz_targets/installable.rs"
test = false
doc = false
bench = false

[workspace]
