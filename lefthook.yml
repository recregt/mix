remotes:
  - git_url: https://github.com/recregt/commitlint
    ref: v1.0.0
    configs:
      - lefthook-remote.yml

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: nix build --no-link .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).fmt
    dependencies:
      glob: "{Cargo.toml,Cargo.lock,**/Cargo.toml}"
      run: S=$(nix eval --raw --impure --expr builtins.currentSystem) && nix build --no-link .#checks.$S.deny .#checks.$S.deny-core .#checks.$S.deny-cli .#checks.$S.deny-explain .#checks.$S.deny-render .#checks.$S.deny-ui
    ruff:
      glob: "*.py"
      run: nix build --no-link .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).ruff

pre-push:
  parallel: true
  commands:
    doc:
      run: nix build --no-link .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).doc
    clippy:
      run: nix build --no-link .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).clippy
    test:
      run: nix build --no-link .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).tests
