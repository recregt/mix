[project]
name = "mix-e2e"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "pytest>=8.4",
    "pytest-xdist>=3.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider", "-rfE"]
verbosity_assertions = 2
markers = [
    "bootstrapped: start from a container where ciuser already ran `mix bootstrap`",
    "unmounted: start a container without the built mix binaries mounted into /usr/local/bin",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
]
