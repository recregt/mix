[project]
name = "mix-e2e"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "pytest>=8.4",
    "pytest-xdist>=3.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider", "-rfE"]
markers = [
    "bootstrapped: start from a container where ciuser already ran `mix bootstrap`",
]
