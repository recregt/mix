[graph]
targets = ["x86_64-unknown-linux-gnu"]
exclude-dev = true

[bans]
multiple-versions = "allow"
deny = [
    { crate = "mix-shell", reason = "mix-explain turns a fault into words and nothing else" },
    { crate = "mix-rpc", reason = "mix-explain turns a fault into words and nothing else" },
    { crate = "mix-exec", reason = "mix-explain turns a fault into words and nothing else" },
    { crate = "tokio", reason = "mix-explain turns a fault into words and nothing else" },
    { crate = "mix-core", reason = "the client reads the protocol, never the daemon's model" },
    { crate = "mix-nixgen", reason = "the client reads the protocol, never the daemon's model" },
    { crate = "mix-pins", reason = "the client reads the protocol, never the daemon's model" },
]
